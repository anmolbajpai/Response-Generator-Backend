spring.application.name=auth

# Server
server.port=8888
#server.servlet.context-path=/auth

# JDBC
spring.datasource.url=jdbc:mysql://localhost:3306/auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
